# Verdaccio local NPM registry for @grest-ts packages
storage: /verdaccio/storage/data
plugins: /verdaccio/plugins

web:
  title: Grest Framework Registry

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: 100

# Disable token expiration (local dev only)
security:
  api:
    jwt:
      sign:
        expiresIn: "100y"

# Scoped package access
packages:
  # Our packages - only available locally, no upstream proxy
  "@grest-ts/*":
    access: $all
    publish: $all
    unpublish: $all

  # Everything else - proxy to public npm
  "**":
    access: $all
    publish: $all
    proxy: npmjs

# Upstream registries
uplinks:
  npmjs:
    url: https://registry.npmjs.org/

# Server settings
server:
  keepAliveTimeout: 60

# Log output
log:
  type: stdout
  format: pretty
  level: warn

# No max body size limit for large packages
max_body_size: 100mb
