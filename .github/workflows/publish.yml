name: Publish to NPM

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  packages: write

jobs:
  publish:
    # Only publish when CI succeeded on a push to release. PR runs of CI
    # complete successfully too — they must never trigger a publish.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          # CI's bump commit lives on master, not on release. workflow_run's
          # head_sha points at the release-branch tip (pre-bump), so we have
          # to explicitly check out master to get the released state.
          ref: master

      - name: Setup Node 25
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npx tsx grest.4.build.ts

      - name: Setup .npmrc for npm
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npx tsx grest.5.npm.publish.ts --ci

      - name: Setup .npmrc for GitHub Packages
        run: |
          echo "registry=https://npm.pkg.github.com" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: npx tsx grest.5.npm.publish.ts --ci --skip-auth-check
