name: CI

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  ci:
    if: "!startsWith(github.event.head_commit.message, 'v')"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 25
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install dependencies
        run: npm install

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Init databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE checklist;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE blocker;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d checklist -f examples/checklist/checklist/schema/checklist.postgres.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d blocker -f examples/checklist/blocker/schema/blocker.postgres.sql

      - name: Check
        run: npx tsx grest.1.check.ts

      - name: Test
        run: npx tsx grest.2.vitest.ts

      - name: Version bump
        run: npx tsx grest.3.ver.patch.ts

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Commit & tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '**/package.json'
          git diff --name-only | xargs -r git checkout --
          git commit -m "v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push --follow-tags
