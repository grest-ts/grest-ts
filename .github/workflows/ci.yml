name: CI

on:
  push:
    branches: [release]
  pull_request:
    branches: [master, dev, release]

# A PR runs code its author wrote, so it gets a read-only token; only the release push may write.
permissions:
  contents: read

# On release: serialize releases, never cancel an in-flight one (a publish
# may be partway through). On every other ref: cancel-in-progress is fine.
concurrency:
  group: ${{ github.ref == 'refs/heads/release' && 'release' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release' }}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/build.yml
    with:
      release: false

  release:
    # Defense-in-depth: skip the bot's own version-bump commits if they ever
    # re-enter (GITHUB_TOKEN-driven pushes don't trigger workflows by default,
    # but keep the guard).
    if: github.event_name == 'push' && github.event.head_commit.author.email != 'github-actions[bot]@users.noreply.github.com'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      release: true
